project:
  name: Field Representative Incentive Anomaly Detection
  seed: 42

paths:
  raw_dir: data/raw
  synthetic_dir: data/synthetic
  processed_dir: data/processed
  artifacts_dir: artifacts
  search_roots:
    - ../..

data:
  fallback_rows: 9000
  fallback_start: "2024-01-01"
  fallback_months: 18
  reps_per_territory: 3
  max_input_rows: null

anomalies:
  injection_rate: 0.06
  contamination: 0.06
  severity_min: 0.35
  severity_max: 1.00
  ranking_cutoffs: [0.01, 0.05, 0.10]

preprocessing:
  scaler: robust
  clip_outliers: true
  clip_lower_quantile: 0.01
  clip_upper_quantile: 0.99
  features:
    - total_sales
    - sales_growth
    - rolling_sales_growth
    - total_quantity
    - quantity_growth
    - average_price
    - sales_per_customer
    - sales_per_product
    - sales_per_call
    - unique_customers
    - customer_coverage_pct
    - customer_concentration
    - channel_mix
    - subchannel_mix
    - unique_products
    - product_concentration
    - dominant_product_share
    - calls_per_working_day
    - calls_per_customer
    - activity_efficiency
    - travel_per_customer
    - workload_index
    - incentive_to_sales_ratio
    - incentive_per_customer
    - incentive_per_call
    - incentive_variance
    - incentive_variance_pct
    - incentive_to_target_ratio
    - sales_vs_peer_median
    - incentive_vs_peer_median
    - activity_vs_peer_median
    - sales_zscore_within_peer
    - incentive_zscore_within_peer
    - activity_zscore_within_peer
    - territory_market_potential
    - territory_customer_density
    - territory_sales_potential
    - opportunity_index
    - market_potential_adjusted_sales
    - target_attainment_pct
    - call_plan_adherence_pct
    - rep_capacity

models:
  metric_sample_size: 2000
  stability_repeats: 4
  perturbation_std: 0.02
  kmeans:
    k_min: 2
    k_max: 12
    n_init: 20
    max_iter: 500
    min_cluster_pct: 1.0
    max_cluster_pct: 90.0
  dbscan:
    min_samples: [5, 8, 12, 16]
    eps_quantiles: [0.70, 0.76, 0.82, 0.86, 0.90, 0.94]
    max_noise_pct: 55.0
    min_cluster_pct: 0.5

selection:
  segmentation_weights:
    silhouette_score: 0.20
    davies_bouldin_score: 0.12
    calinski_harabasz_score: 0.08
    cluster_balance: 0.20
    stability_score: 0.22
    runtime_seconds: 0.03
    interpretability: 0.075
    operational_usefulness: 0.075
  anomaly_weights:
    recall: 0.16
    precision: 0.10
    f2: 0.14
    pr_auc: 0.18
    lift_at_5pct: 0.18
    stability_score: 0.08
    runtime_seconds: 0.04
    interpretability: 0.06
    operational_usefulness: 0.06

reporting:
  top_driver_count: 5
  plot_dpi: 140
  high_risk_top_pct: 0.10

# Presentation policy only: no fitting, recalibration, or test-set optimization.
dashboard:
  very_high_percentile: 0.99
  elevated_percentile: 0.95
  multiple_support_count: 2

extended:
  train_end: '2018-06-01'
  validation_end: '2018-12-01'
  seed: 42
  injection_rate: 0.06
  sensitivity_rate: 0.015
  review_fraction: 0.05
  minimum_peer_count: 4
  preprocessing_clip: false
  signed_log1p: true
  demo_incentives:
    target_history_months: 3
    target_growth: 0.03
    cold_start_target: 100000.0
    base_incentive: 250.0
    attainment_component: 750.0
    attainment_cap: 2.0
    accelerator_threshold: 1.0
    accelerator_amount: 500.0
    adjustment: 0.0
    formulas:
      simulated_target_sales: 'maximum(historical_target * (1 + target_growth), 1)'
      simulated_target_attainment_pct: '100 * maximum(total_sales, 0) / simulated_target_sales'
      simulated_expected_incentive: 'base_incentive + attainment_component * minimum(simulated_target_attainment_pct / 100, attainment_cap) + accelerator_amount * maximum(simulated_target_attainment_pct / 100 - accelerator_threshold, 0)'
      simulated_adjustment: 'adjustment'
      simulated_actual_payout: 'simulated_expected_incentive + simulated_adjustment'
      simulated_payout_delta: 'simulated_actual_payout - simulated_expected_incentive'
      simulated_payout_delta_pct: '100 * simulated_payout_delta / maximum(abs(simulated_expected_incentive), 1)'
      simulated_payout_to_sales_ratio: 'simulated_actual_payout / maximum(abs(total_sales), 1)'
  isolation_forest:
    n_estimators: [200, 500]
    max_samples: [auto, 0.5, 0.8]
    max_features: [0.7, 1.0]
    bootstrap: [false, true]
  autoencoder:
    architectures: [[32, 8, 32], [64, 16, 64]]
    max_iter: 250
    alpha: 0.1
  pca_variance: [0.8, 0.9, 0.95]
  temporal:
    window: 6
    min_history: 3
    ewma_alpha: 0.3
    cusum_drift: 0.5
  ensemble:
    correlation_limit: 0.95
    material_recall_gain: 0.03
    material_pr_auc_gain: 0.02
    weights:
      Isolation Forest: 0.30
      temporal: 0.20
      Robust Peer Baseline: 0.20
      reconstruction: 0.15
      Business Rules: 0.15
  planning:
    capacity_quantile: 0.60
    stable_growth_limit: 0.50
    workload_weights:
      distinct_customers: 0.40
      transaction_count: 0.25
      distinct_cities: 0.15
      distinct_products: 0.10
      distributor_count: 0.10
    uncertainty_quantiles: [0.4, 0.8]
    winsor_quantiles: [0.05, 0.95]
    priority_weights:
      utilization: 0.30
      gap: 0.30
      demand_growth: 0.15
      customer_growth: 0.10
      geographic_load: 0.05
      product_opportunity: 0.05
      workload_pressure: 0.05
