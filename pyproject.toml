[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "field-rep-incentive-anomaly-benchmark"
version = "1.0.0"
description = "Reproducible K-Means and DBSCAN benchmark for field-representative incentive anomaly review."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "scipy>=1.10,<2",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.7,<4",
  "seaborn>=0.13,<1",
  "PyYAML>=6,<7",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
app = ["streamlit>=1.36,<1.50", "plotly>=5.20,<7"]
dev = ["pytest>=8,<9", "nbformat>=5.9,<6"]

[project.scripts]
field-rep-benchmark = "field_rep_anomaly.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
